  <h1>Lückentext: Impfen</h1>
  <p class="lead">Fülle die Lücken mit den Wörtern aus dem Wortspeicher. Groß- und Kleinschreibung ist egal.</p>
  <div class="uebung" data-typ="lueckentext">
<script type="application/json">
{
 "text": "<p>Bei einer [[Schutzimpfung]] werden abgeschwächte oder abgetötete Erreger gespritzt. Der Körper bildet daraufhin selbst [[Antikörper]] und [[Gedächtniszellen]]. Man spricht von einer [[aktiven]] Immunisierung. Der Schutz setzt erst nach einigen Tagen bis Wochen ein, hält aber lange an. Damit er bestehen bleibt, sind manchmal [[Auffrischimpfungen]] nötig.<\/p><p>Bei einer [[Heilimpfung]] bekommt man dagegen fertige Antikörper. Diese [[passive]] Immunisierung wirkt [[sofort]], schützt aber nur wenige Wochen.<\/p><p>Der Arzt [[Edward Jenner|Jenner]] übertrug 1796 Material aus [[Kuhpocken]]-Blasen auf einen Jungen und schützte ihn so vor den Pocken. Alle Impfungen werden im [[Impfausweis]] eingetragen. In Deutschland gibt die [[STIKO]] Empfehlungen zum Impfen.<\/p>"
}
