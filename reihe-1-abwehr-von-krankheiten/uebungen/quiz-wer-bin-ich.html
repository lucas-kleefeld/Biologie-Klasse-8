<article class="spalte lerntext">
  <div class="uebung-kopf"><svg class="ill symbol" viewBox="0 0 64 64" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path class="s f-gelb" d="M10 14 Q 10 8 16 8 H 48 Q 54 8 54 14 V 38 Q 54 44 48 44 H 28 L 18 54 L 20 44 H 16 Q 10 44 10 38 Z"/><text class="h" x="32" y="36" text-anchor="middle">?</text></svg><h1>Quiz: Welche Krankheit bin ich?</h1></div>
  <p class="lead">Lies die Beschreibung und finde heraus, um welche Krankheit es sich handelt.</p>
  <div class="uebung" data-typ="quiz">
<script type="application/json">
{
 "fragen": [
  {
   "frage": "Meine Erreger leben als Sporen in der Erde und gelangen durch Wunden in den Körper. Ihr Gift löst schmerzhafte Muskelkrämpfe aus, oft zuerst im Kiefer.",
   "optionen": [
    "Tetanus",
    "Tuberkulose",
    "Mumps",
    "Keuchhusten"
   ],
   "richtig": 0,
   "erklaerung": "Tetanus heißt auf Deutsch Wundstarrkrampf. Gegen ihn schützt eine Impfung, die alle zehn Jahre aufgefrischt wird."
  },
  {
   "frage": "Ich beginne wie eine Erkältung. Dann kommen heftige Hustenanfälle, nach denen man keuchend einatmet. Für Säuglinge bin ich besonders gefährlich.",
   "optionen": [
    "Keuchhusten",
    "Masern",
    "Grippe",
    "Windpocken"
   ],
   "richtig": 0,
   "erklaerung": "Keuchhusten wird durch Bakterien ausgelöst und durch Tröpfchen übertragen."
  },
  {
   "frage": "Ich wurde früher „Schwindsucht“ genannt. Ich befalle meist die Lunge und muss mindestens sechs Monate mit mehreren Antibiotika behandelt werden.",
   "optionen": [
    "Tuberkulose",
    "Syphilis",
    "Hepatitis B",
    "AIDS"
   ],
   "richtig": 0,
   "erklaerung": "Tuberkulose ist weltweit eine der tödlichsten Infektionskrankheiten."
  },
  {
   "frage": "Man bekommt mich meist durch nicht durchgegarte Eier oder Geflügel. Ich verursache Durchfall, Bauchschmerzen und Erbrechen.",
   "optionen": [
    "Salmonellen-Infektion",
    "Hepatitis B",
    "Mumps",
    "Tetanus"
   ],
   "richtig": 0,
   "erklaerung": "Gründliches Garen und Küchenhygiene schützen vor Salmonellen."
  },
  {
   "frage": "Mein Ausschlag beginnt hinter den Ohren und breitet sich über den ganzen Körper aus. Ich bin extrem ansteckend. In Deutschland müssen Schulkinder gegen mich geimpft sein.",
   "optionen": [
    "Masern",
    "Windpocken",
    "Mumps",
    "Warzen"
   ],
   "richtig": 0,
   "erklaerung": "Masern werden durch Viren ausgelöst. Seit 2020 gibt es eine Impfpflicht für Kinder in Kita und Schule."
  },
  {
   "frage": "Meine Bläschen jucken stark, verkrusten und fallen ab. Wer mich einmal hatte, ist immun, aber ich kann im Alter als Gürtelrose zurückkommen.",
   "optionen": [
    "Windpocken",
    "Lippenherpes",
    "Masern",
    "Syphilis"
   ],
   "richtig": 0,
   "erklaerung": "Das Windpockenvirus bleibt nach der Krankheit in Nervenzellen."
  },
  {
   "frage": "Ich lasse die Ohrspeicheldrüsen anschwellen, sodass man „Hamsterbacken“ bekommt.",
   "optionen": [
    "Mumps",
    "Masern",
    "Keuchhusten",
    "Hepatitis B"
   ],
   "richtig": 0,
   "erklaerung": "Gegen Mumps schützt die Impfung zusammen mit Masern und Röteln."
  },
  {
   "frage": "Ich entzünde die Leber und werde über Blut und Körperflüssigkeiten übertragen. Oft verursache ich Gelbsucht.",
   "optionen": [
    "Hepatitis B",
    "Tuberkulose",
    "Salmonellen-Infektion",
    "Warzen"
   ],
   "richtig": 0,
   "erklaerung": "Gegen Hepatitis B werden in Deutschland schon Säuglinge geimpft."
  },
  {
   "frage": "Ich befalle T-Helferzellen und schwäche so das ganze Immunsystem. Ich bin nicht heilbar, aber gut behandelbar.",
   "optionen": [
    "HIV (AIDS)",
    "Masern",
    "Syphilis",
    "Grippe"
   ],
   "richtig": 0,
   "erklaerung": "Händeschütteln, Umarmen oder Husten übertragen HIV nicht."
  },
  {
   "frage": "Ich bleibe nach der ersten Ansteckung lebenslang in Nervenzellen. Bei Fieber, Sonne oder Stress zeige ich mich als Bläschen an der Lippe.",
   "optionen": [
    "Lippenherpes",
    "Warzen",
    "Windpocken",
    "Mumps"
   ],
   "richtig": 0,
   "erklaerung": "Lippenherpes wird durch Herpes-simplex-Viren ausgelöst."
  }
 ]
}
